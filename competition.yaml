# gta6-trophy-guide-01: "Build the best GTA 6 trophy guide", judged by the house AI judge on a dossier (program/v1 +
# harness.judge, media dossier, an unscreened final over a contender cap, contend rounds on the dev board). OPEN (the
# owner's thumbs up, 2026-11-19: "if it seems like it works let's just ship it"): status open and visibility public, in
# production's seed catalogue in a block of its own, its catalogue row in tests/unit/catalogue.test.ts OPENED_IN_TURN;
# 48 hours of entries from 2026-11-19T11:00Z, the second of the GTA 6 launch slate's three openings 30 minutes apart from
# 10:30Z, set by scripts/redate-bundle.ts --unescrowed (proposed at the seal for 07:30Z). It landed first as a sealed
# internal draft for the owner's review; a seed that inserts it open funds its $250 escrow within a minute, and its
# bytes never change from then (a fix is a new slug).
#
# The ask (the GTA 6 launch slate, 2026-11-18; Grand Theft Auto VI releases 2026-11-19): the owner asked for useful GTA 6
# tools, guides or stats, and trophy guides are among the most-read guides for any big game. The money and window are
# the owner's, relayed by the root on 2026-11-18: "gta6-trophy-guide-01 carries the $250 hundred-place table and a
# 48-hour window". This draft carries the $250 fifty-place table instead (below, The money): a hundred paid places do
# not fit a judged dossier final under the grading-time ceiling, so the owner decides between them before go-live.
#
# What wins, and what it beats. The public trophy guides (PowerPyx, PlayStationTrophies.org, PSNProfiles' guides,
# TrueTrophies, Exophase's lists) are web pages with ads, behind a network, written per site and not yet complete for a
# game a day old; the trackers (PSNProfiles, Exophase) track by syncing a PSN account and give no guide. An entry here
# is an OSI-licensed static web app that works offline from its own files: a tracker over every one of the 55 official
# trophies with its name, description and grade (a checklist saved in the browser with export and import, filters by
# kind, and a spoiler setting that hides story trophies until earned), a roadmap to the platinum and the missables
# flagged, built from the official descriptions, and a guide to each in the entrant's own words that cites its sources
# (what to do, where, when it can be missed). The winner is a free, open-source, offline GTA 6 trophy guide and tracker
# anyone can host or fork, featured in make.fun's posts. The judge cannot play the game or confirm a claim about it, so
# the rubric ranks what a screenshot lets it check (the run review of 2026-11-19, accepted: a rubric paying for "where
# and how" while the rules forbade every outside source paid for invented walkthroughs make.fun would then feature): the
# tracker and its data against the official list first, then the roadmap and missable flags built from the official
# descriptions, then guidance that cites its sources, the prompt giving no credit for a specific location or step that
# cites none, then speed, clarity and polish. The rules let an entry draw on other guides and cite them, never copy
# their text.
#
# Each entry's program, main.ts (Node 22), hands in the guide it built, as makefun-frontend-01's entries hand in a
# frontend: it copies app/ (static files: app/index.html, its modules, styles and data, app/data/trophies.json among
# them) and screenshots/ (3 or 4 PNG or JPEG screens) from its repository to /output, and writes /output/dossier.json with
# vendor/makefun-frontend.ts buildDossier, the library the kit ships (sdk/frontend/makefun-frontend.ts, byte for byte the
# scorer's own copy). The sealed gate (scorer/score.ts, its limits reference/gate.json, the official list
# reference/trophies.json) checks six rows and writes valid from the first five; the judge reads two entries at a time,
# each as its dossier's dossier-view/v1 view (server/judging/dossier-view.ts at dossierViewBudgetOf's default 1,536
# input tokens an entry: this slug is not on DOSSIER_VIEW_BUDGETS): one JPEG contact sheet of every screenshot, the cover
# on top, then an outline of the text (the Load block's Totals line, each source file's path, size and declarations; a
# JSON file by its path and size alone, so the guides' words reach the judge only through the screenshots, and the
# rules say so), and picks one with a margin from 1 to 5 (verdict v2); the entries rank by win rate (resolution.method
# judges). The judge block names superbot at reasoning_effort high with max_output_tokens 17200, gta6-01's; every heat,
# dev and final, is played on OpenRouter z-ai/glm-5.3-flash at its own measured effort and the block's output budget
# (the owner's order of 2026-11-17, server/judging/plan.ts), and the rules say so. An OpenRouter heat sends each call
# once (grader/judge-backup.ts judgeBackupRuleOf); an answer with no verdict is asked once more (grader/judge-call.ts
# JUDGE_CALL_ATTEMPTS 2). The top 10 of the settled final heat are held up to 60 minutes for the make.fun team's
# finalist review (harness.judge.review), which opens each by serving app/ with a static file server and opening
# index.html in desktop Chrome with the network off, and checks what no gate can: that the guide reaches for no network,
# that its guides are its own words, and that it shows no Rockstar logo or official artwork.
#
#   scorer/            makefun-frontend-01's app/ gate, adapted, so its digest is this bundle's own: score.ts with no
#                      origin allowed besides app/ itself (makefun-frontend-01 allowed https://make.fun), media and icon
#                      references (<img>, <source>, <video>, <audio>, <track>, <input type=image> src, srcset and
#                      poster; icon and manifest links; a stylesheet's every url(), a url(#id) fragment passed) held to
#                      app/ too, a font or media one allowed as a data: URL, and a sixth row, trophies: app/data/
#                      trophies.json, at most trophies_max_bytes, an object with a "trophies" array (or the array), names
#                      each of reference/trophies.json's 55 trophies by an item whose "name" equals it under nameKey
#                      (NFKC, curly quotes straight, dashes -, the ellipsis three dots, white space folded, lower case)
#                      and whose "guide" is not blank; valid when the first five rows pass, js_parses shown only.
#                      images.ts, makefun-frontend.ts (sdk/frontend/makefun-frontend.ts byte for byte) and vendor/acorn.mjs
#                      (acorn 8.19.0, its LICENSE beside it) are makefun-frontend-01's byte for byte.
#   reference/         gate.json, gta6-01's limits on app/ in place of game/: app/ at most 993 files and directories and
#                      48 MiB, each path at most 1,000 UTF-8 bytes, app/index.html at most 1 MiB, 3 to 4 screenshots of at
#                      most 256 KiB, long side at most 1280 and short side at least 480 pixels, the dossier at most 1.5
#                      MiB and its text at most 163,840 bytes, and trophies_max_bytes 2 MiB. trophies.json, the official
#                      PlayStation 5 list frozen on 2026-11-18 with its sources in it: every name, description, grade and
#                      hidden flag from https://www.exophase.com/game/grand-theft-auto-vi-psn/trophies/ (plain HTTP), each
#                      grade and PSN's progress targets from https://psnprofiles.com/trophies/43531-grand-theft-auto-vi
#                      (a browser render), the two agreeing on every name, description and grade: 55 trophies, 1
#                      platinum, 2 gold, 6 silver, 46 bronze, 28 hidden; "T**s Ass Drug Money" as PSN publishes it. The
#                      kit carries no reference/ (a judged kit ships nothing sealed), so the starter's app/data/
#                      trophies.json carries the same list whole, and the rules point at it.
#   judge/prompt.txt   the judge's persona and its rubric, four criteria ranked most important first (the tracker and
#                      its data: the official names, descriptions and grades, saved progress, filters, the spoiler
#                      setting, export and import; the roadmap and missables built from the official descriptions; cited
#                      guidance, no credit for an uncited specific; fast, clear and polished, with copying and
#                      Rockstar's art losing), the line that the judge cannot play the game or confirm a claim, the
#                      official list's make-up (55: 1 platinum, 2 gold, 6 silver, 46 bronze), and the close-pair rule,
#                      published word for word in the rules; 2,355 bytes, so a call fits JUDGE_CALL_INPUT_TOKENS_MAX
#                      (below).
#   judge/anchors/     four house guides, weak to strong, each a dossier as an entry writes one, built by the house
#                      (their sources are the dossiers' own text, whole): 1-weak, a bare list of the 55 names, grades and
#                      one-line hints, unstyled, no tracker; 2-plain, the starter: a checklist table saved in
#                      localStorage, a grade filter, export and import, one-line hints; 3-mid, "Leonida trophy tracker",
#                      kind filters, a hidden-trophy switch, a guide pane with each trophy's full guide and its missable
#                      note; 4-strong, "Platinum Road", the house engine (below) with its checklist, guide pane, roadmap,
#                      spoiler setting and save page, on a light paper look. Every guide is the house's own words, from
#                      the trophy list's names, descriptions and PSN targets alone (the house played nothing, and the
#                      guides say plainly where a place is not pinned down). The screenshots are Playwright Chromium
#                      renders at 1280 x 800, JPEG quality 82, of the apps served from their own files with progress
#                      seeded (13 of 55 earned, counters part way), every request checked to stay on app/. The engine's
#                      guide pane names each trophy's sources (Sources: the official list on Exophase for its name,
#                      description and grade, PSNProfiles for PSN's count where it has one, and "our own advice from the
#                      official description, not yet checked in the game" for the guide, a link where the source is a
#                      page), its header the official list's make-up, and its roadmap and missables pages say they are
#                      built from the official descriptions: the house cites what it has and claims nothing it has not
#                      checked. 1-weak, 2-plain and 3-mid cite nothing (their bytes unchanged since the first seal).
#   ladder/            the calibrated dev ladder (harness.judge.ladder, contend beside it): calibration.json and three
#                      rungs, the house engine with more of its parts on: rungs/5-pro.json "Night Shift Trophies"
#                      (search, the missables page, progress counters for PSN's targets; a dark look), rungs/6-elite.json
#                      "Leonida Ledger" (as 5-pro, plus roadmap progress, notes and keys; the light look) and
#                      rungs/7-ace.json "Sunset Platinum" (everything, plus a Next up planner; the dark look, its
#                      screenshots with spoilers on).
#   starter/           a working entry laid out as an entrant's repository (main.ts, serve.ts, vendor/makefun-frontend.ts,
#                      app/, three screenshots, shots.json and its MIT LICENSE): house guide 2-plain, so handed in
#                      unchanged it plays as that anchor; serve.ts and LICENSE are makefun-frontend-01's (serve.ts's
#                      first line names the guide); app/data/trophies.json is the official list with a one-line hint each.
#
