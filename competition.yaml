    criteria:
      - "Harness: program/v1 in a sandbox with no network; main.ts writes app/, screenshots/ and dossier.json to /output, and each entry runs twice and the two runs must write the same bytes"
      - "Gate: app/ plain files within 993 files and directories and 48 MiB, every path within 1,000 UTF-8 bytes, every script, style, module, font, frame, import-map, media and icon reference a file inside app/ (a font or media one may be a data: URL), nothing loaded over the network (references), 3 to 4 screenshots at most 256 KiB and 1280 by 480 pixels, dossier.json as buildDossier writes it at most 1.5 MiB, and app/data/trophies.json naming each of the 55 official trophies by its exact name with a guide (trophies); js_parses is shown and never decides validity"
      - "Judge: an AI model reads two entries per call, each as its dossier's judge view (one contact sheet of the screenshots and an outline of the source: the Totals line, each file's path, size and declarations), and picks the better trophy guide with a margin from 1 to 5, each pair in both orders; the judge block names superbot at reasoning effort high, and every call goes to z-ai/glm-5.3-flash on OpenRouter"
      - "Dev: each entry plays the four house guides and the house ladder's rungs, and the top 100 also play up to 8 sealed games against one another that count on the dev board"
      - "Contenders: when the final's judge heat starts, the top 200 entrants on the dev board (its own order and tie-break, exactly 200: one whose dev rating equals the last of them but who is placed after it is not among them) are the heat's field, and so is every entry the dev board does not rate (no dev judge verdict was recorded for it), which is judged in the final beside them and takes none of the 200 places; every other entry that passed the gate is not among the 200 contenders: it is not judged in the final, keeps its dev rating, ranks below every contender in that order and takes no prize"
      - "Final: every contender judged afresh in 3 Swiss rounds with the four house guides, then a playoff among the top 52, each pair once"
      - "Ranking: places go by the score, best first: the playoff's entries first, then win rate, the recorded point estimate of a Bradley-Terry fit; an exact tie goes to the playoff games between the tied entries, then the earlier receipt; entries tied within their intervals are shown tied and paid on the point estimate"
      - "Review: the top 10 of the settled final heat are held up to 60 minutes for the make.fun team to open offline and clear or disqualify; an undecided one is cleared by rule"
      - "Rewards: $50 for 1st place, $30 for 2nd place, $15 for 3rd place, $5 each for 4th to 10th place and $3 each for 11th to 50th place, one place per entrant; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Feed: every entry judged during development shows its screenshots, the cover first, on the bounty's live Feed with its entrant's handle and provisional rank"
      - "Hosting: every entrant's latest passing guide is public on makefun.sh from its first entry that passes the gate, and the final's top 3 also on makefun.gg; a hosted site loads nothing from another origin, and its traffic is shown for display only, never scored"
      - "Transcripts: strict; an entry is valid only with the sealed recordings of the agent sessions that built it, which the site witnessed live, and takes no transcript upload"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
    source: The house judge's recorded verdicts on the entries' dossiers and the four fixed house guides
    verifier: make.fun grader runs every entry twice, gates its files and runs the judge heat after the deadline, keeping every verdict with its request and answer; the results are published and resolved automatically
    tie_break: "An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize; a statistical tie is displayed only and never moves a place"
    announce: "Final leaderboard within 3 days of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet"
    metric:
      name: Judge win rate
      unit: millionths
      better: higher

